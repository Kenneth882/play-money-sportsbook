services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hoops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoops}
      POSTGRES_DB: ${POSTGRES_DB:-hoops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hoops}:${POSTGRES_PASSWORD:-hoops}@postgres:5432/${POSTGRES_DB:-hoops}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
